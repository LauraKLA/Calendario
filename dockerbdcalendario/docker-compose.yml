services:
  postgres:
    image: postgres:16
    container_name: dockerbdcalendario
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sa
      POSTGRES_DB: Calendario
    networks:
      - red
    volumes:
      - ./init:/docker-entrypoint-initdb.d/

networks:
  red: 
    external: true
    name: dockerbdfestivos_red